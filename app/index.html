<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>The Elden Cube</title>
  </head>
  <body>
    <canvas id="game" aria-label="The Elden Cube game"></canvas>
    <div id="overlay">
      <div id="player-hud" class="hud">
        <div class="hud-row">
          <div class="pips"></div>
          <div class="flask"><div class="flask-icon"></div><span class="flask-count">×3</span></div>
        </div>
        <div class="stamina"><div class="fill"></div></div>
      </div>
      <div id="debug" hidden></div>
      <div id="boss-health" class="hud">
        <div class="health-label">The Elden Cube</div>
        <div class="health-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
